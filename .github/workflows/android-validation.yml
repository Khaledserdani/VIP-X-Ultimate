name: Android validation

# Keep only the newest validation for a feature branch. Push and PR events
# share the same group, preventing duplicate emulator queues for one commit.
concurrency:
  group: android-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  # The feature branch is validated by its pull request event. Running both
  # push and pull_request for the same source commit duplicated emulator jobs.
  push:
    branches:
      - feature/vipx-live-grid
  pull_request:
    branches:
      - feature/vipx-live-grid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  package:
    needs: [test-and-build, android-emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build verified debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload emulator-tested APK
        uses: actions/upload-artifact@v4
        with:
          name: vip-x-debug-emulator-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
