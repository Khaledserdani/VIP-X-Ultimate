name: Android validation

on:
  push:
    branches:
      - feature/vipx-live-grid
  pull_request:
    branches:
      - feature/vipx-live-grid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload build APK
        uses: actions/upload-artifact@v4
        with:
          name: vip-x-debug-build
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable; emulator may fall back to slow TCG mode."
          fi
      - name: Run Android instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  package:
    needs: [test-and-build, android-emulator]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build verified debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload emulator-tested APK
        uses: actions/upload-artifact@v4
        with:
          name: vip-x-debug-emulator-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
