name: VIP X Ultimate Release
on:
  workflow_dispatch:
  push:
    branches:
      - "fix/app-picker-visible-list"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build signed Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check cloud API syntax
        run: node --check server/index.js

      - name: Check agent orchestration syntax
        run: node --check server/agents.js

      - name: Check executable tools syntax
        run: node --check server/tools.js

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP-X-Ultimate-v2.3.2-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
