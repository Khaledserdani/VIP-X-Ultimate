name: VIP X Ultimate Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build signed Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIP_RELEASE_STORE_PASSWORD: ${{ secrets.VIP_RELEASE_STORE_PASSWORD }}
      VIP_RELEASE_KEY_ALIAS: ${{ secrets.VIP_RELEASE_KEY_ALIAS }}
      VIP_RELEASE_KEY_PASSWORD: ${{ secrets.VIP_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Prepare persistent release signing key
        env:
          VIP_RELEASE_KEYSTORE_BASE64: ${{ secrets.VIP_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIP_RELEASE_KEYSTORE_BASE64" || { echo "Missing VIP_RELEASE_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$VIP_RELEASE_STORE_PASSWORD" || { echo "Missing VIP_RELEASE_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$VIP_RELEASE_KEY_ALIAS" || { echo "Missing VIP_RELEASE_KEY_ALIAS repository secret"; exit 1; }
          test -n "$VIP_RELEASE_KEY_PASSWORD" || { echo "Missing VIP_RELEASE_KEY_PASSWORD repository secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/vipx-release.jks"
          printf '%s' "$VIP_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "VIP_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Check cloud API syntax
        run: node --check server/index.js

      - name: Check agent orchestration syntax
        run: node --check server/agents.js

      - name: Check executable tools syntax
        run: node --check server/tools.js

      - name: Test executable tools
        run: node --test server/tools.test.js

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify package, version, and persistent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vipx.ultimate' versionCode='10' versionName='2.3.3'"
          sha256sum "$APK"

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP-X-Ultimate-v2.3.3-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
