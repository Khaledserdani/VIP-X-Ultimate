name: VIP X Ultimate Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build signed Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VIP_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VIP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIP_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing VIP_RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing VIP_RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing VIP_RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing VIP_RELEASE_KEY_PASSWORD" && exit 1)

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VIP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vip-release.jks"
          test -s "$RUNNER_TEMP/vip-release.jks"

      - name: Build signed release APK
        env:
          VIP_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/vip-release.jks
          VIP_RELEASE_STORE_PASSWORD: ${{ secrets.VIP_RELEASE_STORE_PASSWORD }}
          VIP_RELEASE_KEY_ALIAS: ${{ secrets.VIP_RELEASE_KEY_ALIAS }}
          VIP_RELEASE_KEY_PASSWORD: ${{ secrets.VIP_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP-X-Ultimate-v2.2.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
