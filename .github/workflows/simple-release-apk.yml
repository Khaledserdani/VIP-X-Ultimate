name: Build simple signed VIP X APK

on:
  push:
    branches: [ "fix/vipx-no-secret-installable-release", "fix/vipx-draggable-floating-bubble" ]
    paths:
      - "app/**"
      - ".github/workflows/simple-release-apk.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK without user secrets
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vipx.ultimate' versionCode='11' versionName='2.4.0'"
          sha256sum "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP-X-Ultimate-v2.4.0-local-team
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
