name: VIP X backend tests

on:
  pull_request:
    branches:
      - fix/app-picker-visible-list
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  push:
    branches:
      - fix/vipx-free-ai-provider
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run backend tests
        run: npm test
